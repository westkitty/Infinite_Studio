name: Infinite Studio isolated Android engine QA

on:
  push:
    branches:
      - reconcile/restore-original-and-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create temporary local debug signing key
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 90 -dname "CN=Android Debug,O=Android,C=US"
      - name: Run Android JVM and Robolectric tests, compile debug APK
        run: gradle --no-daemon --console plain :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Run companion mock-provider tests
        run: python3 -m unittest discover -s companion -p 'test_*.py' -v
