    <script>
        /**
         * INFINITE AI STUDIO - ARCHITECTURE & STATE
         * True Infinite Canvas Engine + Samsung Galaxy Tab S9 Ultra S-Pen & Multi-Touch
         */
        const state = {
            // Dynamic Infinite Canvas Bounds (expands automatically as you draw/pan)
            canvasBounds: {
                minX: -1200,
                minY: -800,
                width: 2400,
                height: 1600
            },

            tool: 'pencil',           // pencil, ink, marker, watercolor, airbrush, smudge, fill, eraser, transform, lasso, rect-select, eyedropper
            color: '#38bdf8',
            brushSize: 12,
            brushOpacity: 1.0,
            symmetryMode: 'none',     // 'none' | 'vertical' | 'horizontal' | 'quadrant' | 'kaleidoscope'
            shapeGuide: 'freehand',   // 'freehand' | 'line' | 'rect' | 'ellipse'
            sPenOnly: false,          // Default false so both touch & S-Pen draw immediately; toggle ON for strict palm rejection
            paperColor: '#f4f1ea',

            // Layers system
            layers: [],
            activeLayerId: null,

            // History stack for Undo/Redo (stores layer snapshots + bounds)
            history: [],
            historyIndex: -1,
            maxHistory: 20,

            // Viewport Transform (Infinite Pan & Pinch-to-Zoom)
            view: {
                scale: 1.0,
                x: 0,
                y: 0,
                isPanning: false,
                lastPanX: 0,
                lastPanY: 0,
                pinchStartDist: 0,
                pinchStartScale: 1
            },

            // Active Stroke & Stylus Physics
            stroke: {
                isDrawing: false,
                points: [],
                startPt: null,
                currentPt: null,
                lastMid: null
            },

            // Layer Interactive Transform State
            transform: {
                isDragging: false,
                startX: 0,
                startY: 0,
                snapshotCanvas: null
            },

            // AI Selection State (Polygon / Rect / Full Artwork)
            selection: {
                active: false,
                type: null,           // 'lasso' | 'rect' | 'full'
                points: [],           // Array of {x, y} in world coordinates
                bounds: null          // {x, y, w, h} in world coordinates
            },

            // Export configuration
            exportConfig: {
                format: 'png',        // 'png' (transparent) | 'jpg' (flattened)
                jpgQuality: 0.95
            },

            // Active Pointers for Multi-touch Gesture Recognition
            activePointers: new Map(),
            gestureStartTime: 0,
            maxTouchesInGesture: 0,
            gestureMoved: false,
            cursorWorldPos: null
        };

        // DOM References
        const viewport = document.getElementById('viewport');
        const artboardWrapper = document.getElementById('artboard-wrapper');
        const canvasStack = document.getElementById('canvas-stack');
        const paperLayer = document.getElementById('paper-layer');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const overlayCtx = overlayCanvas.getContext('2d');

        // Curated Artist Swatches
        const SWATCHES = [
            '#ffffff', '#d4d4d8', '#71717a', '#27272a', '#09090b', '#78350f',
            '#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', '#22c55e',
            '#10b981', '#14b8a6', '#06b6d4', '#38bdf8', '#3b82f6', '#6366f1',
            '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e', '#fda4af'
        ];

        /**
         * 1. INFINITE CANVAS EXPANSION & LAYER MANAGEMENT SYSTEM
         */
        function ensureInfiniteBoundsContain(worldX, worldY, margin = 250) {
            const b = state.canvasBounds;
            const padStep = 1000;
            let expandLeft = 0, expandTop = 0, expandRight = 0, expandBottom = 0;

            if (worldX - margin < b.minX) {
                expandLeft = Math.ceil((b.minX - (worldX - margin)) / padStep) * padStep;
            }
            if (worldY - margin < b.minY) {
                expandTop = Math.ceil((b.minY - (worldY - margin)) / padStep) * padStep;
            }
            if (worldX + margin > b.minX + b.width) {
                expandRight = Math.ceil(((worldX + margin) - (b.minX + b.width)) / padStep) * padStep;
            }
            if (worldY + margin > b.minY + b.height) {
                expandBottom = Math.ceil(((worldY + margin) - (b.minY + b.height)) / padStep) * padStep;
            }

            if (expandLeft === 0 && expandTop === 0 && expandRight === 0 && expandBottom === 0) {
                return false;
            }

            const newWidth = b.width + expandLeft + expandRight;
            const newHeight = b.height + expandTop + expandBottom;

            if (newWidth > 8000 || newHeight > 8000) return false;

            state.layers.forEach(layer => {
                const temp = document.createElement('canvas');
                temp.width = b.width;
                temp.height = b.height;
                temp.getContext('2d').drawImage(layer.canvas, 0, 0);

                layer.canvas.width = newWidth;
                layer.canvas.height = newHeight;
                layer.ctx.lineCap = 'round';
                layer.ctx.lineJoin = 'round';
                layer.ctx.drawImage(temp, expandLeft, expandTop);
            });

            b.minX -= expandLeft;
            b.minY -= expandTop;
            b.width = newWidth;
            b.height = newHeight;

            overlayCanvas.width = newWidth;
            overlayCanvas.height = newHeight;
            syncCanvasDOM();
            return true;
        }

        function worldToLocal(wx, wy) {
            return {
                x: wx - state.canvasBounds.minX,
                y: wy - state.canvasBounds.minY
            };
        }

        function createLayer(name, insertAboveActive = true) {
            const id = 'layer_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            const canvas = document.createElement('canvas');
            canvas.width = state.canvasBounds.width;
            canvas.height = state.canvasBounds.height;
            canvas.className = 'absolute pointer-events-none';
            canvas.dataset.layerId = id;

            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const layerObj = {
                id,
                name: name || `Layer ${state.layers.length + 1}`,
                canvas,
                ctx,
                visible: true,
                opacity: 1.0,
                blendMode: 'source-over',
                alphaLock: false
            };

            if (insertAboveActive && state.activeLayerId) {
                const idx = state.layers.findIndex(l => l.id === state.activeLayerId);
                state.layers.splice(idx + 1, 0, layerObj);
            } else {
                state.layers.push(layerObj);
            }

            state.activeLayerId = id;
            syncCanvasDOM();
            renderLayerUI();
            return layerObj;
        }

        function getActiveLayer() {
            return state.layers.find(l => l.id === state.activeLayerId) || state.layers[state.layers.length - 1];
        }

        function syncCanvasDOM() {
            const b = state.canvasBounds;
            canvasStack.innerHTML = '';
            state.layers.forEach(layer => {
                layer.canvas.style.left = b.minX + 'px';
                layer.canvas.style.top = b.minY + 'px';
                layer.canvas.style.width = b.width + 'px';
                layer.canvas.style.height = b.height + 'px';
                layer.canvas.style.display = layer.visible ? 'block' : 'none';
                layer.canvas.style.opacity = layer.opacity;
                layer.canvas.style.mixBlendMode = layer.blendMode;
                canvasStack.appendChild(layer.canvas);
            });

            overlayCanvas.style.left = b.minX + 'px';
            overlayCanvas.style.top = b.minY + 'px';
            overlayCanvas.style.width = b.width + 'px';
            overlayCanvas.style.height = b.height + 'px';

            document.getElementById('layer-count-badge').textContent = state.layers.length;
        }

        function renderLayerUI() {
            const list = document.getElementById('layer-list');
            list.innerHTML = '';

            const reversed = [...state.layers].reverse();
            reversed.forEach((layer, revIdx) => {
                const isActive = layer.id === state.activeLayerId;
                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-2 rounded-2xl border transition cursor-pointer ${
                    isActive 
                        ? 'bg-sky-500/15 border-sky-500/50 text-white' 
                        : 'bg-zinc-900/60 border-zinc-800/80 text-zinc-400 hover:bg-zinc-800/70'
                }`;

                row.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-1" data-select-layer="${layer.id}">
                        <div class="w-9 h-7 rounded-lg canvas-checkerboard border border-zinc-700 overflow-hidden shrink-0 relative flex items-center justify-center">
                            <i class="fa-solid fa-layer-group text-[10px] text-zinc-400"></i>
                        </div>
                        <div class="flex flex-col overflow-hidden">
                            <div class="flex items-center gap-1">
                                <span class="text-xs font-medium truncate">${layer.name}</span>
                                ${layer.alphaLock ? '<i class="fa-solid fa-lock text-[9px] text-amber-400" title="Alpha Locked"></i>' : ''}
                            </div>
                            <span class="text-[10px] text-zinc-500 capitalize">${layer.blendMode === 'source-over' ? 'Normal' : layer.blendMode} • ${Math.round(layer.opacity * 100)}%</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-0.5">
                        <button data-move-up="${layer.id}" title="Move Layer Up" class="p-1 rounded hover:bg-zinc-700/70 text-[10px] text-zinc-400 ${revIdx === 0 ? 'opacity-25 pointer-events-none' : ''}">
                            <i class="fa-solid fa-chevron-up"></i>
                        </button>
                        <button data-move-down="${layer.id}" title="Move Layer Down" class="p-1 rounded hover:bg-zinc-700/70 text-[10px] text-zinc-400 ${revIdx === reversed.length - 1 ? 'opacity-25 pointer-events-none' : ''}">
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <button data-toggle-vis="${layer.id}" title="Toggle Visibility" class="p-1.5 rounded-lg hover:bg-zinc-700/70 text-xs ${layer.visible ? 'text-zinc-200' : 'text-zinc-600'}">
                            <i class="fa-solid ${layer.visible ? 'fa-eye' : 'fa-eye-slash'}"></i>
                        </button>
                        ${state.layers.length > 1 ? `
                        <button data-del-layer="${layer.id}" title="Delete Layer" class="p-1.5 rounded-lg hover:bg-red-500/20 hover:text-red-400 text-zinc-500 text-xs">
                            <i class="fa-solid fa-xmark"></i>
                        </button>` : ''}
                    </div>
                `;

                list.appendChild(row);
            });

            const active = getActiveLayer();
            if (active) {
                document.getElementById('select-blend-mode').value = active.blendMode;
                document.getElementById('slider-layer-opacity').value = Math.round(active.opacity * 100);
                document.getElementById('label-layer-opacity').textContent = Math.round(active.opacity * 100) + '%';
                const alphaBtn = document.getElementById('btn-alpha-lock');
                alphaBtn.classList.toggle('bg-amber-500/20', active.alphaLock);
                alphaBtn.classList.toggle('text-amber-300', active.alphaLock);
                alphaBtn.classList.toggle('border-amber-500/40', active.alphaLock);
            }
        }

        /**
         * 2. UNDO / REDO SNAPSHOT HISTORY
         */
        function pushHistory() {
            const active = getActiveLayer();
            if (!active) return;

            if (state.historyIndex < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyIndex + 1);
            }

            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = active.canvas.width;
            snapCanvas.height = active.canvas.height;
            snapCanvas.getContext('2d').drawImage(active.canvas, 0, 0);

            const snapshot = {
                layerId: active.id,
                bounds: { ...state.canvasBounds },
                canvas: snapCanvas
            };

            state.history.push(snapshot);
            if (state.history.length > state.maxHistory) {
                state.history.shift();
            } else {
                state.historyIndex++;
            }
            updateUndoRedoButtons();
        }

        function undo() {
            if (state.historyIndex <= 0) {
                showToast('Nothing to Undo');
                return;
            }
            state.historyIndex--;
            restoreHistoryState(state.history[state.historyIndex]);
            showToast('Undo');
        }

        function redo() {
            if (state.historyIndex >= state.history.length - 1) {
                showToast('Nothing to Redo');
                return;
            }
            state.historyIndex++;
            restoreHistoryState(state.history[state.historyIndex]);
            showToast('Redo');
        }

        function restoreHistoryState(snapshot) {
            const targetLayer = state.layers.find(l => l.id === snapshot.layerId);
            if (targetLayer) {
                targetLayer.ctx.clearRect(0, 0, targetLayer.canvas.width, targetLayer.canvas.height);
                const offsetX = snapshot.bounds.minX - state.canvasBounds.minX;
                const offsetY = snapshot.bounds.minY - state.canvasBounds.minY;
                targetLayer.ctx.drawImage(snapshot.canvas, offsetX, offsetY);
                renderLayerUI();
            }
            updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            document.getElementById('btn-undo').disabled = state.historyIndex <= 0;
            document.getElementById('btn-redo').disabled = state.historyIndex >= state.history.length - 1;
        }

        /**
         * 3. INFINITE VIEWPORT TRANSFORM (CENTER ORIGIN, PAN, PINCH-ZOOM)
         */
        function fitCanvasToScreen() {
            const artBounds = computeArtworkBoundingBox();
            if (artBounds) {
                const vw = viewport.clientWidth || window.innerWidth;
                const vh = viewport.clientHeight || window.innerHeight;
                const padding = 140;
                const scaleX = (vw - padding) / artBounds.w;
                const scaleY = (vh - padding) / artBounds.h;
                state.view.scale = Math.max(0.2, Math.min(scaleX, scaleY, 1.25));
                const centerWorldX = artBounds.x + artBounds.w / 2;
                const centerWorldY = artBounds.y + artBounds.h / 2;
                state.view.x = -centerWorldX * state.view.scale;
                state.view.y = -centerWorldY * state.view.scale;
            } else {
                state.view.scale = 1.0;
                state.view.x = 0;
                state.view.y = 0;
            }
            applyViewportTransform();
            showToast('View Centered');
        }

        function applyViewportTransform() {
            artboardWrapper.style.transform = `translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.scale})`;
            document.getElementById('zoom-indicator').textContent = Math.round(state.view.scale * 100) + '%';
        }

        function screenToWorld(clientX, clientY) {
            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;
            const x = (clientX - vw / 2 - state.view.x) / state.view.scale;
            const y = (clientY - vh / 2 - state.view.y) / state.view.scale;
            return { x, y };
        }

        /**
         * 4. NATURAL MEDIA BRUSH ENGINE (S-PEN PRESSURE & TILT RESPONSIVE)
         */
        function getStylusPressure(e) {
            if (e.pointerType === 'pen') {
                return Math.max(0.05, Math.min(1.0, e.pressure || 0.5));
            }
            return 0.65;
        }

        function drawBrushSegment(ctx, wp1, wp2, wmid1, wmid2, pressure) {
            ensureInfiniteBoundsContain(wmid2.x, wmid2.y, state.brushSize * 2 + 250);

            const p1 = worldToLocal(wp1.x, wp1.y);
            const mid1 = worldToLocal(wmid1.x, wmid1.y);
            const mid2 = worldToLocal(wmid2.x, wmid2.y);

            const activeLayer = getActiveLayer();
            const baseSize = state.brushSize;
            const baseAlpha = state.brushOpacity;
            const color = state.color;

            ctx.save();

            if (state.selection.active && state.selection.type !== 'full' && state.selection.points.length > 2) {
                buildSelectionPath(ctx, true);
                ctx.clip();
            }

            const originLocal = worldToLocal(0, 0);
            const transforms = [(c) => {}];
            if (state.symmetryMode === 'vertical') {
                transforms.push((c) => { c.translate(originLocal.x * 2, 0); c.scale(-1, 1); });
            } else if (state.symmetryMode === 'horizontal') {
                transforms.push((c) => { c.translate(0, originLocal.y * 2); c.scale(1, -1); });
            } else if (state.symmetryMode === 'quadrant') {
                transforms.push((c) => { c.translate(originLocal.x * 2, 0); c.scale(-1, 1); });
                transforms.push((c) => { c.translate(0, originLocal.y * 2); c.scale(1, -1); });
                transforms.push((c) => { c.translate(originLocal.x * 2, originLocal.y * 2); c.scale(-1, -1); });
            } else if (state.symmetryMode === 'kaleidoscope') {
                for (let k = 1; k < 8; k++) {
                    const angle = (k * Math.PI) / 4;
                    transforms.push((c) => {
                        c.translate(originLocal.x, originLocal.y);
                        c.rotate(angle);
                        c.translate(-originLocal.x, -originLocal.y);
                    });
                }
            }

            const defaultComposite = (activeLayer && activeLayer.alphaLock) ? 'source-atop' : 'source-over';

            transforms.forEach((applyTransform) => {
                ctx.save();
                applyTransform(ctx);

                switch (state.tool) {
                    case 'pencil': {
                        const w = Math.max(0.8, baseSize * (0.3 + pressure * 0.85));
                        ctx.globalCompositeOperation = defaultComposite;
                        ctx.strokeStyle = color;
                        ctx.globalAlpha = baseAlpha * (0.35 + pressure * 0.65);
                        ctx.lineWidth = w;
                        ctx.beginPath();
                        ctx.moveTo(mid1.x, mid1.y);
                        ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
                        ctx.stroke();

                        if (pressure > 0.25) {
                            ctx.fillStyle = color;
                            ctx.globalAlpha = baseAlpha * 0.25;
                            for (let i = 0; i < 3; i++) {
                                const rx = mid2.x + (Math.random() - 0.5) * w * 1.1;
                                const ry = mid2.y + (Math.random() - 0.5) * w * 1.1;
                                ctx.fillRect(rx, ry, 1.2, 1.2);
                            }
                        }
                        break;
                    }

                    case 'ink': {
                        const w = Math.max(0.5, baseSize * Math.pow(pressure, 1.3) * 1.4);
                        ctx.globalCompositeOperation = defaultComposite;
                        ctx.strokeStyle = color;
                        ctx.globalAlpha = baseAlpha;
                        ctx.lineWidth = w;
                        ctx.beginPath();
                        ctx.moveTo(mid1.x, mid1.y);
                        ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
                        ctx.stroke();
                        break;
                    }

                    case 'marker': {
                        const w = baseSize * (0.85 + pressure * 0.25);
                        ctx.globalCompositeOperation = defaultComposite;
                        ctx.strokeStyle = color;
                        ctx.globalAlpha = baseAlpha * 0.18;
                        ctx.lineCap = 'square';
                        ctx.lineWidth = w;
                        ctx.beginPath();
                        ctx.moveTo(mid1.x, mid1.y);
                        ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
                        ctx.stroke();
                        break;
                    }

                    case 'watercolor': {
                        const radius = Math.max(2, (baseSize * (0.5 + pressure * 0.8)) / 2);
                        const dist = Math.hypot(mid2.x - mid1.x, mid2.y - mid1.y);
                        const steps = Math.max(1, Math.ceil(dist / (radius * 0.35)));
                        ctx.globalCompositeOperation = defaultComposite;
                        for (let i = 0; i <= steps; i++) {
                            const t = i / steps;
                            const x = mid1.x + (mid2.x - mid1.x) * t;
                            const y = mid1.y + (mid2.y - mid1.y) * t;
                            const grad = ctx.createRadialGradient(x, y, radius * 0.1, x, y, radius);
                            grad.addColorStop(0, hexToRgba(color, baseAlpha * 0.12 * pressure));
                            grad.addColorStop(0.7, hexToRgba(color, baseAlpha * 0.06 * pressure));
                            grad.addColorStop(1, hexToRgba(color, 0));
                            ctx.fillStyle = grad;
                            ctx.beginPath();
                            ctx.arc(x, y, radius, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                    }

                    case 'airbrush': {
                        const radius = Math.max(3, baseSize * (0.6 + pressure * 0.6));
                        ctx.globalCompositeOperation = defaultComposite;
                        const grad = ctx.createRadialGradient(mid2.x, mid2.y, 0, mid2.x, mid2.y, radius);
                        grad.addColorStop(0, hexToRgba(color, baseAlpha * 0.22 * pressure));
                        grad.addColorStop(1, hexToRgba(color, 0));
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(mid2.x, mid2.y, radius, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }

                    case 'smudge': {
                        const radius = Math.max(4, baseSize * 0.75);
                        const cw = ctx.canvas.width;
                        const ch = ctx.canvas.height;
                        const sx = Math.max(0, Math.min(cw - radius * 2, mid1.x - radius));
                        const sy = Math.max(0, Math.min(ch - radius * 2, mid1.y - radius));
                        ctx.globalCompositeOperation = defaultComposite;
                        ctx.globalAlpha = Math.min(0.65, baseAlpha * 0.55 * pressure);
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(mid2.x, mid2.y, radius, 0, Math.PI * 2);
                        ctx.clip();
                        ctx.drawImage(ctx.canvas, sx, sy, radius * 2, radius * 2, mid2.x - radius, mid2.y - radius, radius * 2, radius * 2);
                        ctx.restore();
                        break;
                    }

                    case 'eraser': {
                        const w = Math.max(2, baseSize * (0.4 + pressure * 0.8));
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.strokeStyle = 'rgba(0,0,0,1)';
                        ctx.globalAlpha = baseAlpha;
                        ctx.lineWidth = w;
                        ctx.beginPath();
                        ctx.moveTo(mid1.x, mid1.y);
                        ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
                        ctx.stroke();
                        break;
                    }
                }
                ctx.restore();
            });

            ctx.restore();
        }

        function commitAssistedShape(ctx, wStartPt, wEndPt) {
            const activeLayer = getActiveLayer();
            if (!activeLayer) return;

            ensureInfiniteBoundsContain(wStartPt.x, wStartPt.y, state.brushSize + 200);
            ensureInfiniteBoundsContain(wEndPt.x, wEndPt.y, state.brushSize + 200);

            const startPt = worldToLocal(wStartPt.x, wStartPt.y);
            const endPt = worldToLocal(wEndPt.x, wEndPt.y);
            const originLocal = worldToLocal(0, 0);

            ctx.save();
            if (state.selection.active && state.selection.type !== 'full' && state.selection.points.length > 2) {
                buildSelectionPath(ctx, true);
                ctx.clip();
            }

            const transforms = [(c) => {}];
            if (state.symmetryMode === 'vertical') {
                transforms.push((c) => { c.translate(originLocal.x * 2, 0); c.scale(-1, 1); });
            } else if (state.symmetryMode === 'horizontal') {
                transforms.push((c) => { c.translate(0, originLocal.y * 2); c.scale(1, -1); });
            } else if (state.symmetryMode === 'quadrant') {
                transforms.push((c) => { c.translate(originLocal.x * 2, 0); c.scale(-1, 1); });
                transforms.push((c) => { c.translate(0, originLocal.y * 2); c.scale(1, -1); });
                transforms.push((c) => { c.translate(originLocal.x * 2, originLocal.y * 2); c.scale(-1, -1); });
            } else if (state.symmetryMode === 'kaleidoscope') {
                for (let k = 1; k < 8; k++) {
                    const angle = (k * Math.PI) / 4;
                    transforms.push((c) => { c.translate(originLocal.x, originLocal.y); c.rotate(angle); c.translate(-originLocal.x, -originLocal.y); });
                }
            }

            transforms.forEach((applyTransform) => {
                ctx.save();
                applyTransform(ctx);
                ctx.globalCompositeOperation = state.tool === 'eraser'
                    ? 'destination-out'
                    : (activeLayer.alphaLock ? 'source-atop' : 'source-over');
                ctx.strokeStyle = state.color;
                ctx.globalAlpha = state.brushOpacity;
                ctx.lineWidth = state.brushSize;
                ctx.beginPath();

                if (state.shapeGuide === 'line') {
                    ctx.moveTo(startPt.x, startPt.y);
                    ctx.lineTo(endPt.x, endPt.y);
                } else if (state.shapeGuide === 'rect') {
                    ctx.rect(startPt.x, startPt.y, endPt.x - startPt.x, endPt.y - startPt.y);
                } else if (state.shapeGuide === 'ellipse') {
                    const cx = (startPt.x + endPt.x) / 2;
                    const cy = (startPt.y + endPt.y) / 2;
                    const rx = Math.abs(endPt.x - startPt.x) / 2;
                    const ry = Math.abs(endPt.y - startPt.y) / 2;
                    ctx.ellipse(cx, cy, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
                }
                ctx.stroke();
                ctx.restore();
            });

            ctx.restore();
        }

        function floodFillLayer(ctx, worldX, worldY, fillHex, opacity) {
            ensureInfiniteBoundsContain(worldX, worldY, 400);
            const local = worldToLocal(worldX, worldY);
            const cw = ctx.canvas.width;
            const ch = ctx.canvas.height;
            const x0 = Math.floor(local.x);
            const y0 = Math.floor(local.y);
            if (x0 < 0 || x0 >= cw || y0 < 0 || y0 >= ch) return;

            const imgData = ctx.getImageData(0, 0, cw, ch);
            const data = imgData.data;

            const clean = fillHex.replace('#', '');
            const bigint = parseInt(clean, 16);
            const fillR = (bigint >> 16) & 255;
            const fillG = (bigint >> 8) & 255;
            const fillB = bigint & 255;
            const fillA = Math.round(opacity * 255);

            const startIdx = (y0 * cw + x0) * 4;
            const targetR = data[startIdx];
            const targetG = data[startIdx + 1];
            const targetB = data[startIdx + 2];
            const targetA = data[startIdx + 3];

            if (targetR === fillR && targetG === fillG && targetB === fillB && Math.abs(targetA - fillA) < 5) {
                return;
            }

            if (targetA === 0) {
                showToast('Draw a closed outline first before filling');
                return;
            }

            const tolerance = 32;
            const matchesTarget = (idx) => {
                return (
                    Math.abs(data[idx] - targetR) <= tolerance &&
                    Math.abs(data[idx + 1] - targetG) <= tolerance &&
                    Math.abs(data[idx + 2] - targetB) <= tolerance &&
                    Math.abs(data[idx + 3] - targetA) <= tolerance
                );
            };

            const visited = new Uint8Array(cw * ch);
            const stack = [[x0, y0]];

            while (stack.length > 0) {
                const [cx, cy] = stack.pop();
                let x = cx;
                while (x >= 0 && !visited[cy * cw + x] && matchesTarget((cy * cw + x) * 4)) {
                    x--;
                }
                x++;

                let spanUp = false;
                let spanDown = false;

                while (x < cw && !visited[cy * cw + x] && matchesTarget((cy * cw + x) * 4)) {
                    const pIdx = cy * cw + x;
                    visited[pIdx] = 1;
                    const dIdx = pIdx * 4;
                    data[dIdx] = fillR;
                    data[dIdx + 1] = fillG;
                    data[dIdx + 2] = fillB;
                    data[dIdx + 3] = fillA;

                    if (cy > 0) {
                        const upMatch = !visited[(cy - 1) * cw + x] && matchesTarget(((cy - 1) * cw + x) * 4);
                        if (!spanUp && upMatch) {
                            stack.push([x, cy - 1]);
                            spanUp = true;
                        } else if (spanUp && !upMatch) {
                            spanUp = false;
                        }
                    }

                    if (cy < ch - 1) {
                        const downMatch = !visited[(cy + 1) * cw + x] && matchesTarget(((cy + 1) * cw + x) * 4);
                        if (!spanDown && downMatch) {
                            stack.push([x, cy + 1]);
                            spanDown = true;
                        } else if (spanDown && !downMatch) {
                            spanDown = false;
                        }
                    }
                    x++;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function hexToRgba(hex, alpha) {
            const clean = hex.replace('#', '');
            const bigint = parseInt(clean, 16);
            const r = (bigint >> 16) & 255;
            const g = (bigint >> 8) & 255;
            const b = bigint & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        /**
         * 5. SELECTION, BOUNDING BOX & OVERLAY RENDERING LOOP
         */
        let dashOffset = 0;

        function buildSelectionPath(ctx, convertWorldToLocal = false) {
            const pts = state.selection.points;
            if (!pts || pts.length < 2) return;
            ctx.beginPath();
            const p0 = convertWorldToLocal ? worldToLocal(pts[0].x, pts[0].y) : pts[0];
            ctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < pts.length; i++) {
                const pi = convertWorldToLocal ? worldToLocal(pts[i].x, pts[i].y) : pts[i];
                ctx.lineTo(pi.x, pi.y);
            }
            ctx.closePath();
        }

        function computeSelectionBounds() {
            const pts = state.selection.points;
            if (!pts || pts.length === 0) {
                return computeArtworkBoundingBox() || { x: -500, y: -350, w: 1000, h: 700 };
            }
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            pts.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.x > maxX) maxX = p.x;
                if (p.y > maxY) maxY = p.y;
            });
            return {
                x: Math.floor(minX),
                y: Math.floor(minY),
                w: Math.max(20, Math.ceil(maxX - minX)),
                h: Math.max(20, Math.ceil(maxY - minY))
            };
        }

        function computeArtworkBoundingBox(padding = 40) {
            const b = state.canvasBounds;
            const temp = document.createElement('canvas');
            temp.width = b.width;
            temp.height = b.height;
            const tctx = temp.getContext('2d');

            state.layers.forEach(layer => {
                if (!layer.visible) return;
                tctx.save();
                tctx.globalAlpha = layer.opacity;
                tctx.globalCompositeOperation = layer.blendMode;
                tctx.drawImage(layer.canvas, 0, 0);
                tctx.restore();
            });

            const imgData = tctx.getImageData(0, 0, b.width, b.height).data;
            let minX = b.width, minY = b.height, maxX = 0, maxY = 0;
            let found = false;

            for (let y = 0; y < b.height; y += 2) {
                for (let x = 0; x < b.width; x += 2) {
                    const alpha = imgData[(y * b.width + x) * 4 + 3];
                    if (alpha > 4) {
                        found = true;
                        if (x < minX) minX = x;
                        if (y < minY) minY = y;
                        if (x > maxX) maxX = x;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            if (!found) return null;

            minX = Math.max(0, minX - padding);
            minY = Math.max(0, minY - padding);
            maxX = Math.min(b.width, maxX + padding);
            maxY = Math.min(b.height, maxY + padding);

            return {
                x: b.minX + minX,
                y: b.minY + minY,
                w: Math.max(64, maxX - minX),
                h: Math.max(64, maxY - minY)
            };
        }

        function startOverlayLoop() {
            const renderOverlay = () => {
                const b = state.canvasBounds;
                overlayCtx.clearRect(0, 0, b.width, b.height);
                const originLocal = worldToLocal(0, 0);

                // 1. Subtle Infinite Origin Crosshair (0,0)
                overlayCtx.save();
                overlayCtx.strokeStyle = 'rgba(161, 161, 170, 0.22)';
                overlayCtx.lineWidth = 1.5 / state.view.scale;
                overlayCtx.beginPath();
                overlayCtx.moveTo(originLocal.x - 16, originLocal.y);
                overlayCtx.lineTo(originLocal.x + 16, originLocal.y);
                overlayCtx.moveTo(originLocal.x, originLocal.y - 16);
                overlayCtx.lineTo(originLocal.x, originLocal.y + 16);
                overlayCtx.stroke();
                overlayCtx.restore();

                // 2. Symmetry Line Guides
                if (state.symmetryMode !== 'none') {
                    overlayCtx.save();
                    overlayCtx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
                    overlayCtx.lineWidth = 2 / state.view.scale;
                    overlayCtx.setLineDash([8, 6]);

                    if (state.symmetryMode === 'vertical' || state.symmetryMode === 'quadrant' || state.symmetryMode === 'kaleidoscope') {
                        overlayCtx.beginPath();
                        overlayCtx.moveTo(originLocal.x, 0);
                        overlayCtx.lineTo(originLocal.x, b.height);
                        overlayCtx.stroke();
                    }
                    if (state.symmetryMode === 'horizontal' || state.symmetryMode === 'quadrant' || state.symmetryMode === 'kaleidoscope') {
                        overlayCtx.beginPath();
                        overlayCtx.moveTo(0, originLocal.y);
                        overlayCtx.lineTo(b.width, originLocal.y);
                        overlayCtx.stroke();
                    }
                    if (state.symmetryMode === 'kaleidoscope') {
                        overlayCtx.beginPath();
                        overlayCtx.moveTo(originLocal.x - 3000, originLocal.y - 3000);
                        overlayCtx.lineTo(originLocal.x + 3000, originLocal.y + 3000);
                        overlayCtx.moveTo(originLocal.x + 3000, originLocal.y - 3000);
                        overlayCtx.lineTo(originLocal.x - 3000, originLocal.y + 3000);
                        overlayCtx.stroke();
                    }
                    overlayCtx.restore();
                }

                // 3. Live Assisted Shape Preview
                if (state.stroke.isDrawing && state.shapeGuide !== 'freehand' && state.stroke.startPt && state.stroke.currentPt) {
                    overlayCtx.save();
                    overlayCtx.strokeStyle = state.color;
                    overlayCtx.lineWidth = state.brushSize;
                    overlayCtx.globalAlpha = 0.75;
                    overlayCtx.beginPath();
                    const s = worldToLocal(state.stroke.startPt.x, state.stroke.startPt.y);
                    const e = worldToLocal(state.stroke.currentPt.x, state.stroke.currentPt.y);
                    if (state.shapeGuide === 'line') {
                        overlayCtx.moveTo(s.x, s.y);
                        overlayCtx.lineTo(e.x, e.y);
                    } else if (state.shapeGuide === 'rect') {
                        overlayCtx.rect(s.x, s.y, e.x - s.x, e.y - s.y);
                    } else if (state.shapeGuide === 'ellipse') {
                        const cx = (s.x + e.x) / 2;
                        const cy = (s.y + e.y) / 2;
                        overlayCtx.ellipse(cx, cy, Math.max(1, Math.abs(e.x - s.x) / 2), Math.max(1, Math.abs(e.y - s.y) / 2), 0, 0, Math.PI * 2);
                    }
                    overlayCtx.stroke();
                    overlayCtx.restore();
                }

                // 4. Active AI Selection Marquee
                if (state.selection.active && state.selection.points.length > 1) {
                    dashOffset = (dashOffset - 0.5) % 16;
                    overlayCtx.save();
                    buildSelectionPath(overlayCtx, true);

                    overlayCtx.fillStyle = 'rgba(56, 189, 248, 0.08)';
                    overlayCtx.fill();

                    overlayCtx.lineWidth = 2.5 / state.view.scale;
                    overlayCtx.strokeStyle = '#ffffff';
                    overlayCtx.setLineDash([8, 8]);
                    overlayCtx.lineDashOffset = dashOffset;
                    overlayCtx.stroke();

                    overlayCtx.strokeStyle = '#0284c7';
                    overlayCtx.lineDashOffset = dashOffset + 8;
                    overlayCtx.stroke();
                    overlayCtx.restore();
                }

                // 5. Hover Brush Size Ring
                if (state.cursorWorldPos && !['lasso', 'rect-select', 'transform', 'fill', 'eyedropper'].includes(state.tool)) {
                    const cursorLocal = worldToLocal(state.cursorWorldPos.x, state.cursorWorldPos.y);
                    overlayCtx.save();
                    overlayCtx.strokeStyle = 'rgba(161, 161, 170, 0.7)';
                    overlayCtx.lineWidth = 1.5 / state.view.scale;
                    overlayCtx.beginPath();
                    overlayCtx.arc(cursorLocal.x, cursorLocal.y, Math.max(2, state.brushSize / 2), 0, Math.PI * 2);
                    overlayCtx.stroke();
                    overlayCtx.restore();
                }

                requestAnimationFrame(renderOverlay);
            };
            requestAnimationFrame(renderOverlay);
        }

        /**
         * 6. POINTER & MULTI-TOUCH GESTURE HANDLING (S-PEN + TAB S9 ULTRA)
         */
        viewport.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;

            state.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
            try { viewport.setPointerCapture(e.pointerId); } catch (_) {}

            if (state.activePointers.size === 1) {
                state.gestureStartTime = Date.now();
                state.maxTouchesInGesture = 1;
                state.gestureMoved = false;
            } else {
                state.maxTouchesInGesture = Math.max(state.maxTouchesInGesture, state.activePointers.size);
            }

            // Multi-touch (2+ fingers) -> Infinite Pan & Pinch-to-Zoom
            if (state.activePointers.size >= 2) {
                state.stroke.isDrawing = false;
                state.transform.isDragging = false;
                state.view.isPanning = true;
                const pts = Array.from(state.activePointers.values());
                state.view.lastPanX = (pts[0].x + pts[1].x) / 2;
                state.view.lastPanY = (pts[0].y + pts[1].y) / 2;
                state.view.pinchStartDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                state.view.pinchStartScale = state.view.scale;
                return;
            }

            // S-Pen Guard: when ON, single-finger touch pans while S-Pen/mouse draws
            if (state.sPenOnly && e.pointerType === 'touch') {
                state.view.isPanning = true;
                state.view.lastPanX = e.clientX;
                state.view.lastPanY = e.clientY;
                return;
            }

            const worldPos = screenToWorld(e.clientX, e.clientY);
            state.cursorWorldPos = worldPos;

            if (state.tool === 'eyedropper') {
                sampleColorAt(worldPos.x, worldPos.y);
                return;
            }

            if (state.tool === 'transform') {
                const activeLayer = getActiveLayer();
                if (!activeLayer || !activeLayer.visible) {
                    showToast('Select a visible layer to transform');
                    return;
                }
                state.transform.isDragging = true;
                state.transform.startX = worldPos.x;
                state.transform.startY = worldPos.y;
                const snap = document.createElement('canvas');
                snap.width = activeLayer.canvas.width;
                snap.height = activeLayer.canvas.height;
                snap.getContext('2d').drawImage(activeLayer.canvas, 0, 0);
                state.transform.snapshotCanvas = snap;
                return;
            }

            if (state.tool === 'fill') {
                const activeLayer = getActiveLayer();
                if (!activeLayer || !activeLayer.visible) {
                    showToast('Select a visible layer to fill');
                    return;
                }
                floodFillLayer(activeLayer.ctx, worldPos.x, worldPos.y, state.color, state.brushOpacity);
                pushHistory();
                renderLayerUI();
                return;
            }

            if (state.tool === 'lasso' || state.tool === 'rect-select') {
                state.stroke.isDrawing = true;
                state.selection.active = true;
                state.selection.type = state.tool;
                state.selection.points = [worldPos];
                return;
            }

            const activeLayer = getActiveLayer();
            if (!activeLayer || !activeLayer.visible) {
                showToast('Select a visible layer to draw');
                return;
            }

            state.stroke.isDrawing = true;
            state.stroke.startPt = worldPos;
            state.stroke.currentPt = worldPos;

            if (state.shapeGuide === 'freehand') {
                const pressure = getStylusPressure(e);
                state.stroke.points = [worldPos];
                state.stroke.lastMid = worldPos;
                drawBrushSegment(activeLayer.ctx, worldPos, worldPos, worldPos, worldPos, pressure);
            }
        });

        viewport.addEventListener('pointermove', (e) => {
            const hoverWorldPos = screenToWorld(e.clientX, e.clientY);
            state.cursorWorldPos = hoverWorldPos;

            if (state.activePointers.has(e.pointerId)) {
                const prev = state.activePointers.get(e.pointerId);
                if (Math.hypot(e.clientX - prev.x, e.clientY - prev.y) > 6) {
                    state.gestureMoved = true;
                }
                state.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
            }

            if (state.activePointers.size >= 2 && state.view.isPanning) {
                const pts = Array.from(state.activePointers.values());
                const midX = (pts[0].x + pts[1].x) / 2;
                const midY = (pts[0].y + pts[1].y) / 2;
                const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);

                state.view.x += midX - state.view.lastPanX;
                state.view.y += midY - state.view.lastPanY;
                state.view.lastPanX = midX;
                state.view.lastPanY = midY;

                if (state.view.pinchStartDist > 10) {
                    const ratio = dist / state.view.pinchStartDist;
                    state.view.scale = Math.max(0.15, Math.min(4.0, state.view.pinchStartScale * ratio));
                }
                applyViewportTransform();
                return;
            }

            if (state.sPenOnly && e.pointerType === 'touch' && state.view.isPanning) {
                state.view.x += e.clientX - state.view.lastPanX;
                state.view.y += e.clientY - state.view.lastPanY;
                state.view.lastPanX = e.clientX;
                state.view.lastPanY = e.clientY;
                applyViewportTransform();
                return;
            }

            if (state.transform.isDragging) {
                const activeLayer = getActiveLayer();
                if (activeLayer && state.transform.snapshotCanvas) {
                    const dx = hoverWorldPos.x - state.transform.startX;
                    const dy = hoverWorldPos.y - state.transform.startY;
                    activeLayer.ctx.clearRect(0, 0, activeLayer.canvas.width, activeLayer.canvas.height);
                    activeLayer.ctx.drawImage(state.transform.snapshotCanvas, dx, dy);
                }
                return;
            }

            if (!state.stroke.isDrawing) return;

            if (state.tool === 'lasso') {
                state.selection.points.push(hoverWorldPos);
                return;
            } else if (state.tool === 'rect-select') {
                const start = state.selection.points[0];
                state.selection.points = [
                    { x: start.x, y: start.y },
                    { x: hoverWorldPos.x, y: start.y },
                    { x: hoverWorldPos.x, y: hoverWorldPos.y },
                    { x: start.x, y: hoverWorldPos.y }
                ];
                return;
            }

            if (state.shapeGuide !== 'freehand') {
                state.stroke.currentPt = hoverWorldPos;
                return;
            }

            const activeLayer = getActiveLayer();
            if (!activeLayer) return;

            const events = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];
            events.forEach(ev => {
                const pt = screenToWorld(ev.clientX, ev.clientY);
                const pressure = getStylusPressure(ev);
                const prevPt = state.stroke.points[state.stroke.points.length - 1];
                const midPt = {
                    x: (prevPt.x + pt.x) / 2,
                    y: (prevPt.y + pt.y) / 2
                };

                drawBrushSegment(activeLayer.ctx, prevPt, pt, state.stroke.lastMid, midPt, pressure);

                state.stroke.points.push(pt);
                state.stroke.lastMid = midPt;
            });
        });

        function handlePointerUp(e) {
            state.activePointers.delete(e.pointerId);
            try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}

            if (state.activePointers.size === 0) {
                const elapsed = Date.now() - state.gestureStartTime;
                if (!state.gestureMoved && elapsed < 320) {
                    if (state.maxTouchesInGesture === 2) {
                        undo();
                    } else if (state.maxTouchesInGesture === 3) {
                        redo();
                    }
                }
                state.view.isPanning = false;
            }

            if (state.transform.isDragging) {
                state.transform.isDragging = false;
                state.transform.snapshotCanvas = null;
                pushHistory();
                renderLayerUI();
                return;
            }

            if (state.stroke.isDrawing) {
                state.stroke.isDrawing = false;

                if (state.tool === 'lasso' || state.tool === 'rect-select') {
                    if (state.selection.points.length < 3) {
                        clearSelection();
                    } else {
                        state.selection.bounds = computeSelectionBounds();
                        openAIPromptDock('AI Selection Transform');
                    }
                } else {
                    if (state.shapeGuide !== 'freehand' && state.stroke.startPt && state.stroke.currentPt) {
                        const activeLayer = getActiveLayer();
                        if (activeLayer) {
                            commitAssistedShape(activeLayer.ctx, state.stroke.startPt, state.stroke.currentPt);
                        }
                    }
                    pushHistory();
                    renderLayerUI();
                }
            }
        }

        viewport.addEventListener('pointerup', handlePointerUp);
        viewport.addEventListener('pointercancel', handlePointerUp);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
            state.view.scale = Math.max(0.15, Math.min(4.0, state.view.scale * zoomFactor));
            applyViewportTransform();
        }, { passive: false });

        function sampleColorAt(worldX, worldY) {
            const local = worldToLocal(worldX, worldY);
            const b = state.canvasBounds;
            const px = Math.max(0, Math.min(b.width - 1, Math.floor(local.x)));
            const py = Math.max(0, Math.min(b.height - 1, Math.floor(local.y)));

            const sampleCanvas = document.createElement('canvas');
            sampleCanvas.width = 1;
            sampleCanvas.height = 1;
            const sctx = sampleCanvas.getContext('2d');
            sctx.fillStyle = state.paperColor === 'transparent' ? '#ffffff' : state.paperColor;
            sctx.fillRect(0, 0, 1, 1);

            state.layers.forEach(layer => {
                if (!layer.visible) return;
                sctx.save();
                sctx.globalAlpha = layer.opacity;
                sctx.globalCompositeOperation = layer.blendMode;
                sctx.drawImage(layer.canvas, px, py, 1, 1, 0, 0, 1, 1);
                sctx.restore();
            });

            const data = sctx.getImageData(0, 0, 1, 1).data;
            const hex = '#' + [data[0], data[1], data[2]].map(v => v.toString(16).padStart(2, '0')).join('');
            setActiveColor(hex);
            setActiveTool('pencil');
            showToast(`Sampled ${hex.toUpperCase()}`);
        }

        /**
         * 7. AI GENERATION ENGINE & SMART INFINITE CROP EXPORT
         */
        function renderFlattenedRegion(worldBounds, includePaper = true) {
            const out = document.createElement('canvas');
            out.width = Math.max(1, Math.round(worldBounds.w));
            out.height = Math.max(1, Math.round(worldBounds.h));
            const octx = out.getContext('2d');

            if (includePaper) {
                octx.fillStyle = state.paperColor === 'transparent' ? '#ffffff' : state.paperColor;
                octx.fillRect(0, 0, out.width, out.height);
            }

            const localOrigin = worldToLocal(worldBounds.x, worldBounds.y);

            state.layers.forEach(layer => {
                if (!layer.visible) return;
                octx.save();
                octx.globalAlpha = layer.opacity;
                octx.globalCompositeOperation = layer.blendMode;
                octx.drawImage(
                    layer.canvas,
                    localOrigin.x, localOrigin.y, out.width, out.height,
                    0, 0, out.width, out.height
                );
                octx.restore();
            });
            return out;
        }

        function renderFlattenedCanvas(includePaper = true) {
            const artBounds = computeArtworkBoundingBox(40) || { x: -500, y: -350, w: 1000, h: 700 };
            return renderFlattenedRegion(artBounds, includePaper);
        }

        async function runAIGeneration() {
            const promptText = document.getElementById('input-ai-prompt').value.trim();
            if (!promptText) {
                showToast('Enter a prompt to transform your sketch');
                return;
            }

            const loading = document.getElementById('loading-overlay');
            loading.classList.remove('hidden');

            try {
                const isFullCanvas = state.selection.type === 'full' || !state.selection.active;
                const bounds = isFullCanvas
                    ? (computeArtworkBoundingBox(40) || { x: -500, y: -350, w: 1000, h: 700 })
                    : computeSelectionBounds();

                ensureInfiniteBoundsContain(bounds.x, bounds.y, 100);
                ensureInfiniteBoundsContain(bounds.x + bounds.w, bounds.y + bounds.h, 100);

                const cropCanvas = renderFlattenedRegion(bounds, true);
                const base64Data = cropCanvas.toDataURL('image/png').split(',')[1];

                const systemInstruction = isFullCanvas
                    ? `Transform and render this digital sketch according to the user's request while preserving the composition, pose, and main shapes: ${promptText}`
                    : `Transform and render this cropped region of an illustration according to the user's request while preserving the sketch lines, structure, and seamless visual cohesion: ${promptText}`;

                const payload = {
                    contents: [{
                        role: 'user',
                        parts: [
                            { text: systemInstruction },
                            {
                                inlineData: {
                                    mimeType: 'image/png',
                                    data: base64Data
                                }
                            }
                        ]
                    }],
                    generationConfig: {
                        responseModalities: ['TEXT', 'IMAGE']
                    }
                };

                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;

                const response = await fetchWithBackoff(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                if (!part) {
                    throw new Error('No image returned from AI model.');
                }

                const generatedSrc = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                const img = await loadImage(generatedSrc);

                const shortName = promptText.slice(0, 18) + (promptText.length > 18 ? '...' : '');
                const aiLayer = createLayer(`AI: ${shortName}`, true);
                const localTarget = worldToLocal(bounds.x, bounds.y);

                aiLayer.ctx.save();
                if (!isFullCanvas && state.selection.points.length > 2) {
                    buildSelectionPath(aiLayer.ctx, true);
                    aiLayer.ctx.clip();
                }
                aiLayer.ctx.drawImage(img, localTarget.x, localTarget.y, bounds.w, bounds.h);
                aiLayer.ctx.restore();

                pushHistory();
                renderLayerUI();
                clearSelection();
                showToast('AI Layer Generated!');
            } catch (err) {
                console.error(err);
                showToast('AI Render failed. Check prompt or try again.');
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function fetchWithBackoff(url, options, retries = 4, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, options);
                    if (res.ok) return res;
                    if (res.status !== 429 && res.status < 500) return res;
                } catch (e) {
                    if (i === retries - 1) throw e;
                }
                await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
            }
            return fetch(url, options);
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

                showToast(toolName === 'lasso' ? 'Draw a freehand loop around any area for AI' : 'Drag a box around any area for AI');

        function transformActiveLayer(fn) {
            const active = getActiveLayer();
            if (!active) return;
            const cw = active.canvas.width;
            const ch = active.canvas.height;
            const temp = document.createElement('canvas');
            temp.width = cw;
            temp.height = ch;
            temp.getContext('2d').drawImage(active.canvas, 0, 0);

            const viewCenterWorld = screenToWorld(
                (viewport.clientWidth || window.innerWidth) / 2,
                (viewport.clientHeight || window.innerHeight) / 2
            );
            const pivotLocal = worldToLocal(viewCenterWorld.x, viewCenterWorld.y);

            active.ctx.save();
            active.ctx.clearRect(0, 0, cw, ch);
            active.ctx.translate(pivotLocal.x, pivotLocal.y);
            fn(active.ctx);
            active.ctx.translate(-pivotLocal.x, -pivotLocal.y);
            active.ctx.drawImage(temp, 0, 0);
            active.ctx.restore();

            pushHistory();
            renderLayerUI();
        }

        function handleImageImport(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const cleanName = file.name.replace(/\.[^/.]+$/, '').slice(0, 18) || 'Imported Image';
                    const layer = createLayer(`Img: ${cleanName}`, true);

                    const scale = Math.min(1200 / img.width, 800 / img.height, 1.0);
                    const drawW = img.width * scale;
                    const drawH = img.height * scale;

                    const viewCenterWorld = screenToWorld(
                        (viewport.clientWidth || window.innerWidth) / 2,
                        (viewport.clientHeight || window.innerHeight) / 2
                    );
                    ensureInfiniteBoundsContain(viewCenterWorld.x - drawW / 2, viewCenterWorld.y - drawH / 2, 150);
                    ensureInfiniteBoundsContain(viewCenterWorld.x + drawW / 2, viewCenterWorld.y + drawH / 2, 150);

                    const localTopLeft = worldToLocal(viewCenterWorld.x - drawW / 2, viewCenterWorld.y - drawH / 2);
                    layer.ctx.drawImage(img, localTopLeft.x, localTopLeft.y, drawW, drawH);

                    pushHistory();
                    renderLayerUI();
                    showToast(`Imported "${cleanName}" onto new layer`);
                };
                img.onerror = () => showToast('Could not read image file');
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

                    const idx = state.layers.findIndex(l => l.id === id);
                    if (idx < state.layers.length - 1) {
                        [state.layers[idx], state.layers[idx + 1]] = [state.layers[idx + 1], state.layers[idx]];
                        syncCanvasDOM();
                        renderLayerUI();
                    }
                    return;
                }

                if (downEl) {
                    const id = downEl.dataset.moveDown;
                    const idx = state.layers.findIndex(l => l.id === id);
                    if (idx > 0) {
                        [state.layers[idx], state.layers[idx - 1]] = [state.layers[idx - 1], state.layers[idx]];
                        syncCanvasDOM();
                        renderLayerUI();
                    }
                    return;
                }

                if (visEl) {
                    const layer = state.layers.find(l => l.id === visEl.dataset.toggleVis);
                    if (layer) {
                        layer.visible = !layer.visible;
                        syncCanvasDOM();
                        renderLayerUI();
                    }
                    return;
                }

                if (delEl) {
                    if (state.layers.length <= 1) return;
                    const id = delEl.dataset.delLayer;
                    state.layers = state.layers.filter(l => l.id !== id);
                    if (state.activeLayerId === id) {
                        state.activeLayerId = state.layers[state.layers.length - 1].id;
                    }
                    syncCanvasDOM();
                    renderLayerUI();
                    return;
                }

                if (selectEl) {
                    state.activeLayerId = selectEl.dataset.selectLayer;
                    renderLayerUI();
                }
            });

            // Paper Background Buttons
            document.querySelectorAll('.paper-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const color = btn.dataset.paper;
                    state.paperColor = color;
                    if (color === 'transparent') {
                        paperLayer.style.backgroundColor = 'transparent';
                        paperLayer.classList.add('canvas-checkerboard');
                    } else {
                        paperLayer.classList.remove('canvas-checkerboard');
                        paperLayer.style.backgroundColor = color;
                    }
                });
            });

            // Keyboard Shortcuts (Ctrl+Z / Ctrl+Y)
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) redo();
                    else undo();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                    e.preventDefault();
                    redo();
                }
            });
        }

        /**
         * 9. BOOTSTRAP STUDIO ON LOAD
         */
        function initStudio() {
            createLayer('Ink & Detail', false);
            createLayer('Sketch Base', false);
            state.activeLayerId = state.layers[0].id;
            syncCanvasDOM();
            renderLayerUI();
            pushHistory();
            fitCanvasToScreen();
            bindUIEvents();
            startOverlayLoop();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initStudio);
        } else {
            initStudio();
        }
    </script>
</body>
</html>
