<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite AI Studio - Tab S9 Ultra Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Custom styling optimized for OLED screens (Galaxy Tab S9 Ultra) and touch/stylus precision */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Checkerboard pattern for transparent canvas layers */
        .canvas-checkerboard {
            background-image: 
                linear-gradient(45deg, #18181b 25%, transparent 25%), 
                linear-gradient(-45deg, #18181b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #18181b 75%), 
                linear-gradient(-45deg, transparent 75%, #18181b 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
            background-color: #121214;
        }

        /* Custom Range Sliders for Stylus Ergonomics */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
            border: 2px solid #ffffff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #27272a;
            border-radius: 3px;
        }

        /* Glassmorphism floating panels */
        .glass-panel {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7);
        }

        /* Custom Scrollbar for Layers */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 2px;
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between">

    <!-- Hidden File Input for Image Import -->
    <input type="file" id="input-import-file" accept="image/*" class="hidden">

    <!-- Top Floating Bar: Undo/Redo, Symmetry Modes, Shape Guides, S-Pen Guard, View Reset, Import & Export -->
    <header class="fixed top-3 left-1/2 -translate-x-1/2 z-30 glass-panel rounded-2xl px-3 py-1.5 flex items-center gap-1 sm:gap-1.5 max-w-[96vw] overflow-x-auto">
        <!-- App Brand Badge -->
        <div class="flex items-center gap-2 pr-2 border-r border-zinc-700/70 shrink-0">
            <div class="w-7 h-7 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center shadow-md shadow-sky-500/20">
                <i class="fa-solid fa-wand-magic-sparkles text-white text-xs"></i>
            </div>
            <span class="hidden xl:inline font-semibold text-xs tracking-wide text-zinc-200">INFINITE <span class="text-sky-400">AI</span></span>
        </div>

        <!-- Undo / Redo -->
        <button id="btn-undo" title="Undo (Two-Finger Tap)" class="p-2.5 rounded-xl hover:bg-zinc-800 active:bg-zinc-700 text-zinc-300 disabled:opacity-30 transition shrink-0">
            <i class="fa-solid fa-rotate-left text-sm"></i>
        </button>
        <button id="btn-redo" title="Redo (Three-Finger Tap)" class="p-2.5 rounded-xl hover:bg-zinc-800 active:bg-zinc-700 text-zinc-300 disabled:opacity-30 transition shrink-0">
            <i class="fa-solid fa-rotate-right text-sm"></i>
        </button>

        <div class="h-5 w-[1px] bg-zinc-700/70 mx-0.5 shrink-0"></div>

        <!-- Symmetry Cycle (Off -> Vertical -> Horizontal -> Quadrant -> Kaleidoscope 8x) -->
        <button id="btn-symmetry" title="Cycle Symmetry Guides" class="px-2.5 py-2 rounded-xl hover:bg-zinc-800 text-zinc-400 transition flex items-center gap-1.5 shrink-0">
            <i class="fa-solid fa-arrows-left-right-to-line text-sm"></i>
            <span id="label-symmetry" class="hidden md:inline text-xs font-medium">Sym: Off</span>
        </button>

        <!-- Shape Constraint Cycle (Freehand -> Line -> Rectangle -> Ellipse) -->
        <button id="btn-shape-guide" title="Cycle Assisted Shape Guides" class="px-2.5 py-2 rounded-xl hover:bg-zinc-800 text-zinc-400 transition flex items-center gap-1.5 shrink-0">
            <i id="icon-shape-guide" class="fa-solid fa-bezier-curve text-sm"></i>
            <span id="label-shape-guide" class="hidden lg:inline text-xs font-medium">Freehand</span>
        </button>

        <!-- S-Pen Guard Toggle -->
        <button id="btn-spen-only" title="Toggle S-Pen Guard" class="px-2.5 py-2 rounded-xl hover:bg-zinc-800 text-zinc-400 transition flex items-center gap-1.5 shrink-0">
            <i class="fa-solid fa-pen-nib text-sm"></i>
            <span id="label-spen-only" class="hidden sm:inline text-xs font-medium">Touch + Pen</span>
        </button>

        <div class="h-5 w-[1px] bg-zinc-700/70 mx-0.5 shrink-0"></div>

        <!-- Zoom & Fit Canvas -->
        <button id="btn-reset-view" title="Fit Canvas to Screen" class="px-2.5 py-2 rounded-xl hover:bg-zinc-800 text-xs font-mono text-zinc-300 transition shrink-0">
            <span id="zoom-indicator">100%</span>
        </button>

        <!-- Import Image as Layer -->
        <button id="btn-import" title="Import Reference or Photo as Layer" class="px-2.5 py-2 rounded-xl bg-zinc-800/90 hover:bg-zinc-700 text-zinc-200 border border-zinc-700/80 font-medium text-xs transition flex items-center gap-1.5 shrink-0">
            <i class="fa-solid fa-file-import text-sky-400"></i>
            <span class="hidden sm:inline">Import</span>
        </button>

        <!-- Export Modal Trigger (Transparent PNG / JPG) -->
        <button id="btn-export-open" title="Export Artwork (Transparent PNG or JPG)" class="px-3 py-2 rounded-xl bg-zinc-100 hover:bg-white text-zinc-900 font-semibold text-xs transition flex items-center gap-1.5 shadow shrink-0">
            <i class="fa-solid fa-download"></i>
            <span class="hidden sm:inline">Export</span>
        </button>
    </header>

    <!-- Left Floating Ergonomic Dock: Brush Size, Opacity & Color Wheel Trigger -->
    <aside class="fixed left-3 top-1/2 -translate-y-1/2 z-30 glass-panel rounded-3xl p-2.5 flex flex-col items-center gap-4">
        <!-- Color Swatch Trigger -->
        <button id="btn-color-picker" title="Color Studio" class="w-10 h-10 rounded-full border-2 border-white shadow-lg transition transform active:scale-95 relative" style="background-color: #38bdf8;">
            <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-zinc-900 border border-zinc-700 flex items-center justify-center text-[9px] text-zinc-300">
                <i class="fa-solid fa-palette"></i>
            </span>
        </button>

        <!-- Brush Size Control -->
        <div class="flex flex-col items-center gap-1.5 w-full">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400">Size</span>
            <div class="h-28 flex items-center justify-center">
                <input type="range" id="slider-size" min="1" max="120" value="12" class="w-24 -rotate-90 origin-center">
            </div>
            <span id="label-size" class="text-[11px] font-mono text-zinc-300">12px</span>
        </div>

        <div class="w-6 h-[1px] bg-zinc-700/70"></div>

        <!-- Brush Opacity Control -->
        <div class="flex flex-col items-center gap-1.5 w-full">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400">Flow</span>
            <div class="h-28 flex items-center justify-center">
                <input type="range" id="slider-opacity" min="5" max="100" value="100" class="w-24 -rotate-90 origin-center">
            </div>
            <span id="label-opacity" class="text-[11px] font-mono text-zinc-300">100%</span>
        </div>

        <!-- Eyedropper Quick Button -->
        <button id="btn-eyedropper" data-tool="eyedropper" title="Eyedropper" class="tool-btn w-10 h-10 rounded-2xl hover:bg-zinc-800 text-zinc-300 flex items-center justify-center transition">
            <i class="fa-solid fa-eye-dropper text-sm"></i>
        </button>
    </aside>

    <!-- Popover: Color Studio (HSL + Quick Swatches) -->
    <div id="popover-color" class="hidden fixed left-20 top-1/2 -translate-y-1/2 z-40 glass-panel rounded-3xl p-4 w-64 flex flex-col gap-3">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider text-zinc-300">Color Studio</span>
            <button id="close-color" class="text-zinc-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <!-- Native Color Wheel + Hex -->
        <div class="flex items-center gap-3">
            <input type="color" id="input-color-native" value="#38bdf8" class="w-14 h-14 rounded-2xl bg-transparent border-0 cursor-pointer">
            <div class="flex flex-col gap-1 flex-1">
                <label class="text-[10px] text-zinc-400 uppercase">Hex Code</label>
                <input type="text" id="input-color-hex" value="#38BDF8" maxlength="7" class="bg-zinc-900/90 border border-zinc-700 rounded-xl px-2.5 py-1.5 text-xs font-mono text-zinc-100 uppercase focus:outline-none focus:border-sky-500">
            </div>
        </div>

        <!-- Curated Artist Swatches -->
        <div>
            <span class="text-[10px] text-zinc-400 uppercase block mb-2">Studio Swatches</span>
            <div id="swatch-grid" class="grid grid-cols-6 gap-2">
                <!-- Populated via JS -->
            </div>
        </div>
    </div>

    <!-- Right Floating Dock: Layers Panel Toggle & Drawer -->
    <aside class="fixed right-3 top-1/2 -translate-y-1/2 z-30 flex items-center gap-2">
        <!-- Expandable Layer Stack Panel -->
        <div id="panel-layers" class="hidden glass-panel rounded-3xl p-3.5 w-72 sm:w-80 max-h-[78vh] flex flex-col gap-3">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-sky-400 text-xs"></i>
                    <span class="text-xs font-semibold tracking-wide text-zinc-200">LAYERS</span>
                </div>
                <div class="flex items-center gap-1">
                    <button id="btn-add-layer" title="New Layer" class="p-1.5 rounded-lg bg-sky-500/20 hover:bg-sky-500/30 text-sky-400 text-xs transition">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <button id="btn-dup-layer" title="Duplicate Layer" class="p-1.5 rounded-lg hover:bg-zinc-800 text-zinc-300 text-xs transition">
                        <i class="fa-regular fa-clone"></i>
                    </button>
                    <button id="btn-merge-down" title="Merge Down" class="p-1.5 rounded-lg hover:bg-zinc-800 text-zinc-300 text-xs transition">
                        <i class="fa-solid fa-compress"></i>
                    </button>
                    <button id="btn-clear-layer" title="Clear Layer" class="p-1.5 rounded-lg hover:bg-red-500/20 hover:text-red-400 text-zinc-400 text-xs transition">
                        <i class="fa-solid fa-eraser"></i>
                    </button>
                </div>
            </div>

            <!-- Active Layer Blend Mode, Alpha Lock & Opacity -->
            <div class="bg-zinc-900/80 rounded-2xl p-2.5 flex flex-col gap-2 border border-zinc-800/80">
                <div class="flex items-center justify-between gap-2">
                    <select id="select-blend-mode" class="bg-zinc-800 text-zinc-200 text-xs rounded-lg px-2 py-1 border border-zinc-700 focus:outline-none flex-1">
                        <option value="source-over">Normal</option>
                        <option value="multiply">Multiply</option>
                        <option value="screen">Screen</option>
                        <option value="overlay">Overlay</option>
                        <option value="darken">Darken</option>
                        <option value="lighten">Lighten</option>
                        <option value="color-dodge">Color Dodge</option>
                        <option value="color-burn">Color Burn</option>
                    </select>
                    <button id="btn-alpha-lock" title="Alpha Lock (Paint only on existing pixels)" class="px-2.5 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-400 border border-zinc-700 text-xs font-medium flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-lock text-[10px]"></i>
                        <span>Alpha Lock</span>
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[11px] text-zinc-400">Opacity</span>
                    <input type="range" id="slider-layer-opacity" min="0" max="100" value="100" class="flex-1">
                    <span id="label-layer-opacity" class="text-[11px] font-mono text-zinc-300 w-8 text-right">100%</span>
                </div>
            </div>

            <!-- Layer List Container -->
            <div id="layer-list" class="flex-1 overflow-y-auto flex flex-col gap-1.5 pr-1">
                <!-- Dynamically rendered layers -->
            </div>

            <!-- Paper Background Toggle -->
            <div class="pt-2 border-t border-zinc-800 flex items-center justify-between">
                <span class="text-xs text-zinc-400">Canvas Paper</span>
                <div class="flex items-center gap-1.5">
                    <button data-paper="#ffffff" class="paper-btn w-5 h-5 rounded-full bg-white border border-zinc-500" title="Bright White"></button>
                    <button data-paper="#f4f1ea" class="paper-btn w-5 h-5 rounded-full bg-[#f4f1ea] border border-zinc-500" title="Warm Sketchbook"></button>
                    <button data-paper="#1e1e22" class="paper-btn w-5 h-5 rounded-full bg-[#1e1e22] border border-zinc-500" title="Dark Slate"></button>
                    <button data-paper="transparent" class="paper-btn w-5 h-5 rounded-full canvas-checkerboard border border-zinc-500" title="Transparent Grid"></button>
                </div>
            </div>
        </div>

        <!-- Layer Drawer Trigger Pill -->
        <button id="btn-toggle-layers" title="Toggle Layers Panel" class="glass-panel rounded-2xl p-3 flex flex-col items-center gap-2 hover:bg-zinc-800/90 transition text-zinc-200">
            <i class="fa-solid fa-layer-group text-sky-400 text-base"></i>
            <span id="layer-count-badge" class="text-[10px] font-mono bg-zinc-800 px-1.5 py-0.5 rounded-md text-zinc-300">2</span>
        </button>
    </aside>

    <!-- Main Interactive Viewport (Pan / Zoom / Stylus Canvas) -->
    <main id="viewport" class="w-full h-full relative overflow-hidden flex items-center justify-center bg-[#09090b] cursor-crosshair">
        <!-- Infinite Paper Background Layer (covers entire viewport dynamically) -->
        <div id="paper-layer" class="absolute inset-0 bg-[#f4f1ea] pointer-events-none"></div>

        <!-- Transformable Infinite Artboard Container -->
        <div id="artboard-wrapper" class="absolute top-1/2 left-1/2 origin-top-left pointer-events-none" style="width: 1px; height: 1px;">
            <!-- Dynamic Drawing Canvases Stack -->
            <div id="canvas-stack" class="absolute top-0 left-0 pointer-events-none"></div>

            <!-- Interactive Overlay Canvas (Live Brush Cursor, Symmetry Guides, Shape Preview, Selection Marquee) -->
            <canvas id="overlay-canvas" width="2400" height="1600" class="absolute pointer-events-none z-20"></canvas>
        </div>

        <!-- Floating Layer Transform Dock (Visible when Transform tool is active) -->
        <div id="transform-dock" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-40 glass-panel rounded-3xl px-4 py-2.5 flex items-center gap-3 border border-amber-500/40 shadow-2xl">
            <span class="text-xs font-semibold text-amber-300 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-up-down-left-right"></i> Layer Transform
            </span>
            <div class="h-4 w-[1px] bg-zinc-700"></div>
            <button id="btn-tf-flip-h" class="px-2.5 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-200" title="Flip Horizontal">
                <i class="fa-solid fa-left-right"></i> Flip H
            </button>
            <button id="btn-tf-flip-v" class="px-2.5 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-200" title="Flip Vertical">
                <i class="fa-solid fa-up-down"></i> Flip V
            </button>
            <button id="btn-tf-scale-down" class="px-2.5 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-200" title="Scale 90%">
                <i class="fa-solid fa-magnifying-glass-minus"></i>
            </button>
            <button id="btn-tf-scale-up" class="px-2.5 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-200" title="Scale 110%">
                <i class="fa-solid fa-magnifying-glass-plus"></i>
            </button>
            <button id="btn-tf-rotate" class="px-2.5 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-200" title="Rotate 15°">
                <i class="fa-solid fa-rotate-right"></i> 15°
            </button>
            <button id="btn-tf-done" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-zinc-950 font-semibold text-xs">
                Done
            </button>
        </div>

        <!-- Floating AI Selection Action Bar (Appears when a region is selected or full-canvas AI is triggered) -->
        <div id="ai-prompt-dock" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-40 glass-panel rounded-3xl p-3.5 w-[92vw] max-w-xl flex flex-col gap-2.5 border border-sky-500/40 shadow-2xl shadow-sky-950/50">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
                    <span id="ai-selection-badge" class="text-xs font-semibold text-sky-300 uppercase tracking-wider">AI Selection Transform</span>
                </div>
                <button id="btn-cancel-selection" class="text-xs text-zinc-400 hover:text-white px-2 py-1 rounded-lg hover:bg-zinc-800">
                    <i class="fa-solid fa-xmark mr-1"></i>Clear
                </button>
            </div>

            <div class="flex items-center gap-2">
                <input type="text" id="input-ai-prompt" placeholder="Describe what to render or transform in this area (e.g., 'detailed cyberpunk helmet, glowing neon visor')..." class="flex-1 bg-zinc-950/90 border border-zinc-700/80 rounded-2xl px-3.5 py-2.5 text-xs sm:text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-sky-400">
                <button id="btn-run-ai" class="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-white font-semibold text-xs sm:text-sm shadow-lg shadow-sky-500/25 flex items-center gap-2 shrink-0 transition active:scale-95">
                    <i class="fa-solid fa-sparkles"></i>
                    <span>Render</span>
                </button>
            </div>

            <!-- Quick Style Chips for Stylus Tap Convenience -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5">
                <button data-prompt-chip="Refine sketch into clean polished digital illustration, vibrant lighting" class="prompt-chip text-[11px] bg-zinc-800/90 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1 rounded-full whitespace-nowrap border border-zinc-700/60">✨ Refine Sketch</button>
                <button data-prompt-chip="Photorealistic studio render, detailed textures, dramatic rim light" class="prompt-chip text-[11px] bg-zinc-800/90 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1 rounded-full whitespace-nowrap border border-zinc-700/60">📸 Photorealistic</button>
                <button data-prompt-chip="Lush watercolor and gouache painting on textured paper" class="prompt-chip text-[11px] bg-zinc-800/90 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1 rounded-full whitespace-nowrap border border-zinc-700/60">🎨 Watercolor</button>
                <button data-prompt-chip="Anime key visual art style, cel shaded, crisp linework" class="prompt-chip text-[11px] bg-zinc-800/90 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1 rounded-full whitespace-nowrap border border-zinc-700/60">🌸 Anime Render</button>
            </div>
        </div>
    </main>

    <!-- Bottom Floating Dock: Infinite Painter Brush Engine, Transform & Selection/AI Tools -->
    <footer class="fixed bottom-3 left-1/2 -translate-x-1/2 z-30 glass-panel rounded-3xl px-3 py-2 flex items-center gap-1 sm:gap-1.5 max-w-[96vw] overflow-x-auto">
        <!-- Brush Presets -->
        <button data-tool="pencil" class="tool-btn active-tool px-3 py-2 rounded-2xl bg-sky-500/20 text-sky-400 border border-sky-500/40 flex flex-col items-center gap-1 min-w-[58px] transition shrink-0">
            <i class="fa-solid fa-pencil text-sm"></i>
            <span class="text-[10px] font-medium">6B Pencil</span>
        </button>

        <button data-tool="ink" class="tool-btn px-3 py-2 rounded-2xl hover:bg-zinc-800 text-zinc-400 flex flex-col items-center gap-1 min-w-[58px] transition shrink-0">
            <i class="fa-solid fa-pen-nib text-sm"></i>
            <span class="text-[10px] font-medium">Tech Ink</span>
        </button>

        <button data-tool="marker" class="tool-btn px-3 py-2 rounded-2xl hover:bg-zinc-800 text-zinc-400 flex flex-col items-center gap-1 min-w-[58px] transition shrink-0">
            <i class="fa-solid fa-highlighter text-sm"></i>
            <span class="text-[10px] font-medium">Marker</span>
        </button>

        <button data-tool="watercolor" class="tool-btn px-3 py-2 rounded-2xl hover:bg-zinc-800 text-zinc-400 flex flex-col items-center gap-1 min-w-[58px] transition shrink-0">
            <i class="fa-solid fa-paintbrush text-sm"></i>
            <span class="text-[10px] font-medium">Soft Wash</span>
        </button>

        <button data-tool="airbrush" class="tool-btn px-3 py-2 rounded-2xl hover:bg-zinc-800 text-zinc-400 flex flex-col items-center gap-1 min-w-[58px] transition shrink-0">
            <i class="fa-solid fa-spray-can text-sm"></i>
            <span class="text-[10px] font-medium">Airbrush</span>
        </button>

        <button data-tool="smudge" class="tool-btn px-3 py-2 rounded-2xl hover:bg-zinc-800 text-zinc-400 flex flex-col items-center gap-1 min-w-[58px] transition shrink-0">
            <i class="fa-solid fa-hand-sparkles text-sm"></i>
            <span class="text-[10px] font-medium">Smudge</span>
        </button>

        <button data-tool="fill" class="tool-btn px-3 py-2 rounded-2xl hover:bg-zinc-800 text-zinc-400 flex flex-col items-center gap-1 min-w-[58px] transition shrink-0">
            <i class="fa-solid fa-fill-drip text-sm"></i>
            <span class="text-[10px] font-medium">Fill</span>
        </button>

        <button data-tool="eraser" class="tool-btn px-3 py-2 rounded-2xl hover:bg-zinc-800 text-zinc-400 flex flex-col items-center gap-1 min-w-[58px] transition shrink-0">
            <i class="fa-solid fa-eraser text-sm"></i>
            <span class="text-[10px] font-medium">Eraser</span>
        </button>

        <div class="h-7 w-[1px] bg-zinc-700/70 mx-0.5 shrink-0"></div>

        <!-- Layer Transform Tool -->

    <div id="toast-box" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300">
